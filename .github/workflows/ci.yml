# Everything but the speech recognizers, which need a Mac and gigabytes of models.
name: ci
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bun run typecheck
      - run: bun run lint
      - run: cargo test --workspace
      - run: bun test --timeout 30000 src eval
      - run: bun eval/budget.ts --no-speed
      - run: bun scripts/browser-check.ts chromium
        env:
          BROWSER_CHANNEL: chrome
      - run: bun run e2e:smoke -- --no-speed --json e2e/out/report.json
        env:
          BROWSER_CHANNEL: chrome
          E2E_AUDIO_AUTOPLAY: "1"
      - name: Pack the qualified npm artifact
        run: npm pack --ignore-scripts --json --pack-destination "$RUNNER_TEMP" > "$RUNNER_TEMP/npm-pack.json"
      - uses: actions/upload-artifact@v4
        with:
          name: npm-package-${{ github.sha }}
          path: |
            ${{ runner.temp }}/chimera-kit-*.tgz
            ${{ runner.temp }}/npm-pack.json
          if-no-files-found: error
